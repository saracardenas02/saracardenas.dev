<header class="nav" [class.nav--scrolled]="isScrolled()">
  <div class="wrap nav__row">
    <a href="#top" class="nav__brand" aria-label="Sara Cárdenas">
      <span class="nav__mark" aria-hidden="true">SC</span>
      <span class="nav__name">Sara Cárdenas</span>
    </a>
    <nav class="nav__links" aria-label="Secciones">
      <a href="#experiencia">{{'nav.work'|translate}}</a>
      <a href="#proyectos">{{'nav.projects'|translate}}</a>
      <a href="#stack">{{'nav.stack'|translate}}</a>
    </nav>
    <div class="nav__end">
      <button class="nav__lang" (click)="lang.toggle()"
              [attr.aria-label]="lang.current() === 'es' ? 'Switch to English' : 'Cambiar a español'">
        {{ lang.current() === 'es' ? 'EN' : 'ES' }}
      </button>
      <a href="#contacto" class="btn btn--primary nav__cta">{{'nav.cta'|translate}}</a>
    </div>
  </div>
</header>
